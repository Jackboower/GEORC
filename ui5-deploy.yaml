# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: moovi.georc
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: Moovi
          url: https://ndc-srvhana.opus-idc.com.br:8100/
          client: '250'
        app:
          name: ZTFN_GEORC_APP
          description: App Geo Rc
          package: ZTFN_GEORC_TESTE
          transport: S4HK903158
        exclude:
          - /test/
